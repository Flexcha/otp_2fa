{% extends "base.html" %}

{% block content %}
    <h3 class="mb-1 text-center">Setup 2FA</h3>
    <p class="text-muted text-center mb-4">Scan this QR code with your authenticator app.</p>
    
    <div class="text-center mb-4">
        <img src="data:image/png;base64,{{ qr_b64 }}" class="qr-img img-fluid bg-white" alt="QR Code">
        <div class="mt-3 text-muted small">Or enter this code manually:</div>
        <div class="fw-bold font-monospace bg-light p-2 border rounded mt-1 text-primary">{{ secret }}</div>
    </div>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Authentication Code</label>
            <input type="text" name="otp" class="form-control text-center form-control-lg" style="letter-spacing: 5px;" placeholder="000000" required>
        </div>
        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-success">Verify & Enable</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-link text-muted text-decoration-none">Cancel</a>
        </div>
    </form>
{% endblock %}
