{% extends "base.html" %}

{% block content %}
    <h3 class="mb-2 text-center">Two-Factor Auth</h3>
    <p class="text-muted text-center mb-4 small">Enter the 6-digit code from your app, or use an 8-character backup code.</p>
    
    <form method="POST">
        <div class="mb-4">
            <input type="text" name="otp" class="form-control form-control-lg text-center" style="letter-spacing: 5px;" placeholder="000000" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Verify Code</button>
    </form>
    
    <div class="text-center mt-4">
        <form method="POST" action="{{ url_for('resend_otp') }}">
            <button type="submit" class="btn btn-link text-decoration-none text-muted small p-0">Didn't receive a code? Resend OTP via Email</button>
        </form>
    </div>
{% endblock %}
