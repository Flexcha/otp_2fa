{% extends "base.html" %}

{% block content %}
    <h3 class="mb-2 text-center">Log In</h3>
    <p class="text-muted text-center mb-4">Please enter your credentials.</p>
    
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        
        <div class="d-flex justify-content-between mb-4 mt-2">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label text-muted" for="rememberMe"><small>Remember me</small></label>
            </div>
            <a href="#" class="text-decoration-none"><small>Forgot password?</small></a>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
    </form>
    
    <div class="text-center mt-4">
        <span class="text-muted small">Don't have an account?</span> <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold small">Sign up</a>
    </div>
{% endblock %}
